<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marginalia</title>
  <meta name="description" content="A local-first novel reader with a spoiler-safe reading companion and character tracking.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const p = JSON.parse(localStorage.getItem('marginalia.prefs') || '{}');
      if (p.theme) document.documentElement.dataset.theme = p.theme;
    } catch {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="layer"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
